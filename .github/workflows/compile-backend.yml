name: Compile Java Backend

# Triggered automatically on push or pull request events
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/compile-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'

# Workflow permissions
permissions:
  contents: read

jobs:
  compile:
    name: Compile Spring Boot Backend
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Java environment
      # Configures Java 17 using Temurin distribution
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # Step 3: Verify Maven installation
      - name: Verify Maven version
        run: mvn --version
      
      # Step 4: Compile the application using Maven
      # Runs clean compile to ensure fresh build
      - name: Compile with Maven
        run: |
          cd app
          mvn clean compile
        
      # Step 5: Run tests (optional, can be separated into different job)
      - name: Run tests
        run: |
          cd app
          mvn test
        continue-on-error: true
      
      # Step 6: Package the application
      - name: Package application
        run: |
          cd app
          mvn package -DskipTests
      
      # Step 7: Upload build artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-backend-jar
          path: app/target/*.jar
          retention-days: 7
      
      # Step 8: Display build information
      - name: Build summary
        run: |
          echo "✅ Build completed successfully"
          echo "📦 Artifacts generated:"
          ls -lh app/target/*.jar || echo "No JAR files found"

  # Optional: Additional job for code quality checks
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run checkstyle
        run: |
          cd app
          mvn checkstyle:check || true
      
      - name: Dependency check
        run: |
          cd app
          mvn dependency:analyze || true
