<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor - Admin Portal</title>
    <link rel="stylesheet" href="dashboard-styles.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">
                <h2>🏥 Smart Clinic</h2>
                <p>Admin Portal</p>
            </div>
            <nav>
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="add-doctor.html" class="active">👨‍⚕️ Add Doctor</a>
                <a href="doctors-list.html">📋 Doctors List</a>
                <a href="reports.html">📈 Reports</a>
                <a href="index.html">🚪 Logout</a>
            </nav>
        </aside>
        
        <main class="content">
            <header>
                <h1>Add New Doctor</h1>
                <div class="user-info">
                    <span id="adminName">Admin User</span>
                </div>
            </header>
            
            <div class="card">
                <form id="addDoctorForm" class="doctor-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" required placeholder="Dr. John Smith">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" required placeholder="doctor@clinic.com">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" required placeholder="+1234567890">
                        </div>
                        
                        <div class="form-group">
                            <label for="specialization">Specialization *</label>
                            <select id="specialization" required>
                                <option value="">Select Specialization</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Neurology">Neurology</option>
                                <option value="General Practice">General Practice</option>
                                <option value="Psychiatry">Psychiatry</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Initial Password *</label>
                        <input type="password" id="password" required placeholder="Enter initial password">
                    </div>
                    
                    <div class="form-group">
                        <label>Available Times</label>
                        <div class="availability-section">
                            <div class="day-schedule">
                                <label><input type="checkbox" name="monday"> Monday</label>
                                <input type="text" placeholder="09:00-17:00" class="time-input">
                            </div>
                            <div class="day-schedule">
                                <label><input type="checkbox" name="tuesday"> Tuesday</label>
                                <input type="text" placeholder="09:00-17:00" class="time-input">
                            </div>
                            <div class="day-schedule">
                                <label><input type="checkbox" name="wednesday"> Wednesday</label>
                                <input type="text" placeholder="09:00-17:00" class="time-input">
                            </div>
                            <div class="day-schedule">
                                <label><input type="checkbox" name="thursday"> Thursday</label>
                                <input type="text" placeholder="09:00-17:00" class="time-input">
                            </div>
                            <div class="day-schedule">
                                <label><input type="checkbox" name="friday"> Friday</label>
                                <input type="text" placeholder="09:00-17:00" class="time-input">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="history.back()">Cancel</button>
                        <button type="submit" class="btn-primary">Add Doctor</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
    <script src="add-doctor.js"></script>
</body>
</html>
